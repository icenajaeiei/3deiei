<style>
:root{--bg:#f4f5f4;--fg:#1d1a16;--card:#fff;--mut:#6b6358;--ac:#00b14f;--line:#e4dbcd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#view{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
#stage{flex:1;position:relative;min-height:160px;background:#181614;overflow:hidden;touch-action:none}

#mw{position:relative;flex:0 0 auto;overflow:hidden}#map{width:100%;display:block;max-height:44vh;background:#ebe7dc;touch-action:none;cursor:grab}
#mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}#mc .ib{width:36px;height:36px;padding:0;border-radius:50%;font-size:15px}

.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s infinite}@keyframes pu{from{transform:scale(.7);opacity:.6}to{transform:scale(2.2);opacity:0}}
#tc{flex:1;overflow:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.stp{display:flex;margin-bottom:6px}.stp span{font-size:11px;color:var(--mut);text-align:center;flex:1}.stp span.on{color:var(--ac);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .6s}
.rd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
*,*::before,*::after{box-sizing:border-box}
body{min-width:0;height:100dvh}
#top h1,.mi .t,.rc>span{min-width:0;overflow-wrap:anywhere}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#top button:focus-visible{outline-color:#fff}
@media(max-width:380px){#top{gap:6px;padding:10px}#top h1{font-size:16px}.rc,.mi{gap:8px;padding:10px}.th{width:56px;height:56px}#vp{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.sg button{padding:6px 10px}}

<!-- 3D & Inline AR Stage (Zappar for A-Frame: Instant World Tracking) -->
<section id="view" hidden>
 <div id="stage">
  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; colorManagement: true; exposure: 1.1;"
  >
    <!-- Permissions and compatibility UI for camera -->
    <a-entity zappar-permissions-ui id="permissions"></a-entity>
    <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

    <!-- Zappar Camera with rear camera feed directly on the webpage -->
    <a-entity camera zappar-camera="userFacing: false;"></a-entity>

    <!-- Zappar Instant World Tracking anchor (tracks tabletop/floor surface) -->
    <a-entity zappar-instant="placement-mode: true; anchorPoseOffset: 0 -0.28 -1.2;" id="instant-tracker">
      <a-entity id="food-container" position="0 0 0" rotation="0 0 0">
        <a-entity id="food-model"></a-entity>
        <!-- Soft realistic ground contact shadow -->
        <a-ring color="#000000" opacity="0.35" radius-inner="0" radius-outer="0.18" rotation="-90 0 0" position="0 0.001 0"></a-ring>
      </a-entity>
    </a-entity>

    <!-- Realistic Warm Lights for Food Presentation -->
    <a-entity light="type: ambient; color: #fff8f0; intensity: 0.95;"></a-entity>
    <a-entity light="type: directional; color: #fff4e2; intensity: 1.5; castShadow: true;" position="1.5 4 2.5"></a-entity>
    <a-entity light="type: directional; color: #ffcca0; intensity: 0.6;" position="-2 2 -1"></a-entity>
  </a-scene>

  <img id="pimg" hidden alt="">
  <button id="vback" class="ib">← เมนู</button>

    <button id="ar-place-btn" class="ar-action-btn">
      📍 วางบนโต๊ะตรงนี้ (ล็อคพื้น)

    <div id="hint">ส่องกล้องหาโต๊ะ • กด "วางบนโต๊ะตรงนี้" เพื่อล็อคอาหารติดพื้น • ลากนิ้วเพื่อหมุนดูรอบจาน</div>
  </div>
 </div>

 <div id="vp">
  <h2 id="vn"></h2>
  <p id="vd"></p>
  <div class="row">
    <button class="ib" id="ar-place-toggle">📍 วาง / ย้ายที่</button>
    <button class="ib" id="scale-up-btn">🔍 + ขยาย</button>
    <button class="ib" id="scale-down-btn">🔍 − ย่อ</button>
    <button class="ib" id="rp">🔄 รีเซ็ตมุมมอง</button>
    <button class="ib" id="ph">📷 ภาพจริง</button>
    <button class="ib" id="up">📤 อัปโหลดรูป</button>

    <span class="sg"><button id="qm">−</button><button id="qn" style="pointer-events:none">1</button><button id="qp">+</button></span>

</section>

<div id="sheet" hidden><div id="sb"></div></div>
<section id="track" hidden><div id="tt"><button id="tb" class="ib">✕</button><div><b id="ts"></b><small id="te"></small></div></div><div id="mw"><svg id="map" viewBox="0 0 360 250"></svg><div id="mc"><button id="mzi" class="ib">＋</button><button id="mzo" class="ib">－</button><button id="mrl" class="ib">⟲</button><button id="mrr" class="ib">⟳</button><button id="mre" class="ib">🎯</button></div><div id="mhint">ลากเลื่อน • บีบนิ้วซูม/หมุน • 🎯 ตามไรเดอร์</div></div><div id="tc"></div></section>

<script>
(()=>{
const $=s=>document.querySelector(s);

// ---- Realistic Real-world Dimensions in Meters (ปรับขนาดโมเดลอาหารแต่ละชนิดให้เหมาะสมกับโลกจริง)
const REAL_WORLD_SIZES = {
  // Burgers & Mains
  'สแมชเบอร์เกอร์เนื้อชีส': 0.15,        // 15 ซม. (เบอร์เกอร์เดี่ยว)
  'ดับเบิลเบอร์เกอร์ & เฟรนช์ฟรายส์': 0.22,   // 22 ซม. (ถาดเบอร์เกอร์+เฟรนช์ฟรายส์)
  'สเต๊กเนื้อย่างจิ้มแจ่ว': 0.28,          // 28 ซม. (จานสเต๊กเนื้อ)
  'พิซซ่าเตาฟืนพรีเมียม': 0.35,          // 35 ซม. (พิซซ่าถาด 14 นิ้ว)
  'ริซอตโต้เห็ดทรัฟเฟิล': 0.26,          // 26 ซม. (จานริซอตโต้)
  // Noodles & Soups
  'ซุปหัวหอมสไตล์อิตาเลียน': 0.20,        // 20 ซม. (ถ้วยซุป)
  'ต้มแซ่บกระดูกอ่อนสูตรโบราณ': 0.22,      // 22 ซม. (ชามต้มแซ่บ)
  'ก๋วยเตี๋ยวต้มยำกุ้งแม่น้ำ': 0.25,       // 25 ซม. (ชามก๋วยเตี๋ยว)
  'ผัดหมี่โบราณสูตรคุณยาย': 0.26,         // 26 ซม. (จานผัดหมี่)
  'ราเมนทงคตสึสไปซี่': 0.26,           // 26 ซม. (ชามราเมน)
  'อุด้งร้อนเซ็ตญี่ปุ่น': 0.28,           // 28 ซม. (ถาดเซ็ตอุด้ง)
  'ยากิโซบะกระทะร้อน': 0.26,          // 26 ซม. (กระทะร้อน)
  'ซูชิเรือรวมมิตรพรีเมียม': 0.45,        // 45 ซม. (เรือซูชิรวมมิตร)
  // Desserts & Bakery
  'ครัวซองต์เนยสดฝรั่งเศส': 0.18,         // 18 ซม. (ครัวซองต์)
  'แครมบรูเล่วานิลลาแท้': 0.14,         // 14 ซม. (ถ้วยคาราเมล)
  'โดนัทรวมรสพรีเมียม': 0.20,           // 20 ซม. (จานโดนัท)
  'ไอศกรีมช็อกโกแลตซันเดย์': 0.16,       // 16 ซม. (ถ้วยไอศกรีม)
  'บลูเบอร์รีคัพเค้กครีมชีส': 0.12,       // 12 ซม. (คัพเค้ก)
  'เค้กช็อกโกแลตบราวนี่ฟัดจ์': 0.20,      // 20 ซม. (จานเค้ก)
  'เค้กเชอร์รีดับเบิลเลเยอร์': 0.22       // 22 ซม. (จานเค้กสองชั้น)
};

// ---- Database for custom user models (.glb) in IndexedDB
const dbo=()=>new Promise((res,rej)=>{const r=indexedDB.open('food3d',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbGet(k){try{const d=await dbo();return new Promise((res,rej)=>{const q=d.transaction('m').objectStore('m').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function dbSet(k,v){try{const d=await dbo();return new Promise((res,rej)=>{const t=d.transaction('m','readwrite'),s=t.objectStore('m');v?s.put(v,k):s.delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}

// ---- data: [ชื่อ, ราคา, อีโมจิ, หมวด, คำอธิบาย, สี, โมเดลจริง GLB]
const RESTS=[
{e:'🍔',n:'Smash Burger & Co.',c:'อเมริกัน',r:4.7,km:1.2,d:'เบอร์เกอร์เนื้อสแมชไฟแรง เสิร์ฟร้อนๆ ทุกชิ้น',m:[
 ['สแมชเบอร์เกอร์เนื้อชีส',189,'🍔','burger','เนื้อย่างไฟแรง ชีสเชดดาร์เยิ้ม ผักสด ขนมปังงาหอมเนย',{},'/models/burger.glb'],
 ['ดับเบิลเบอร์เกอร์ & เฟรนช์ฟรายส์',249,'🍟','burger','เนื้อสองชิ้น ชีสเยิ้ม พร้อมเฟรนช์ฟรายส์กรอบสีทอง',{},'/models/burger.glb'],
 ['โดนัทรวมรสพรีเมียม',69,'🍩','donut','โดนัทเนื้อนุ่ม เคลือบเกลซช็อกโกแลตและสตรอว์เบอร์รี',{},'/models/donuts.glb'],
 ['ไอศกรีมช็อกโกแลตซันเดย์',79,'🍨','icecream','ไอศกรีมช็อกโกแลตเข้มข้น หอมมันกลมกล่อม',{main:'#8a5a3c',accent:'#4a2a1c'},'/models/ice_cream_chocolate.glb']]},
{e:'🍕',n:'ลานพิซซ่า',c:'อิตาเลียน',r:4.6,km:2.4,d:'พิซซ่าแป้งบางกรอบ อบเตาฟืน',m:[

const MV=[20,60,120,180,240,300,340],MH=[25,55,110,150,175,215,238];
function route(a,b){const ia=[MV.indexOf(a[0]),MH.indexOf(a[1])],ib=[MV.indexOf(b[0]),MH.indexOf(b[1])],key=(i,j,d)=>i+','+j+','+d,dist=new Map(),prev=new Map(),pq=[[0,ia[0],ia[1],-1]],D=[[1,0],[-1,0],[0,1],[0,-1]];let end=null;dist.set(key(ia[0],ia[1],-1),0);
 while(pq.length){pq.sort((p,q)=>p[0]-q[0]);const [c,i,j,d]=pq.shift();if(c>(dist.has(key(i,j,d))?dist.get(key(i,j,d)):1e9))continue;if(i===ib[0]&&j===ib[1]){end=key(i,j,d);break}
  D.forEach((v,k)=>{const ni=i+v[0],nj=j+v[1];if(ni<0||nj<0||ni>=MV.length||nj>=MH.length)return;const w=Math.abs(MV[ni]-MV[i])+Math.abs(MH[nj]-MH[j])+(d>=0&&d!==k?14:0),nk=key(ni,nj,k),nc=c+w;if(nc<(dist.has(nk)?dist.get(nk):1e9)){dist.set(nk,nc);prev.set(nk,key(i,j,d));pq.push([nc,ni,nj,k])}})}
 const pts=[];let k=end;while(k){const [i,j]=k.split(',').map(Number);pts.unshift([MV[i],MH[j]]);k=prev.get(k)}
 return pts.filter((p,n,a)=>n===0||n===a.length-1||!((a[n-1][0]===p[0]&&p[0]===a[n+1][0])||(a[n-1][1]===p[1]&&p[1]===a[n+1][1])))}
const routeLen=a=>a.reduce((s,p,i)=>i?s+Math.abs(p[0]-a[i-1][0])+Math.abs(p[1]-a[i-1][1]):0,0);
function destNode(a){a=a||addr;if(!a||!a.text)return[300,55];let h=0;const t=(a.label||'')+a.text;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return[MV[h%MV.length],MH[(h>>>8)%MH.length]]}
function destFor(r,a){const n=destNode(a);return n[0]===r.pos[0]&&n[1]===r.pos[1]?[MV[(MV.indexOf(n[0])+2)%MV.length],n[1]]:n}
const kmOf=r=>Math.max(.5,routeLen(route(r.pos,destFor(r)))/150);

// ---- Apply Real-world scale to 3D Mesh
function applyFoodScale(){
 if(!currentLoadedMesh||!rawMeshBounds||!it)return;
 const targetMeters=REAL_WORLD_SIZES[it.n]||0.25;
 const s=(targetMeters*currentScaleMultiplier)/rawMeshBounds.maxDim;
 currentLoadedMesh.scale.set(s,s,s);
 // Center horizontally and align bottom plate exactly flush on floor/table (Y = 0)
 currentLoadedMesh.position.set(-rawMeshBounds.center.x*s, -rawMeshBounds.minY*s, -rawMeshBounds.center.z*s);
}

// Listen to model-loaded event from A-Frame GLTF loader
const foodModelEl=$('#food-model');
foodModelEl.addEventListener('model-loaded',()=>{
 const mesh=foodModelEl.getObject3D('mesh');
 if(!mesh)return;
 currentLoadedMesh=mesh;
 mesh.updateMatrixWorld(true);
 const THREE=window.THREE||(window.AFRAME&&window.AFRAME.THREE);
 if(!THREE)return;
 const bbox=new THREE.Box3().setFromObject(mesh);
 const size=bbox.getSize(new THREE.Vector3());
 const center=bbox.getCenter(new THREE.Vector3());
 rawMeshBounds={
  center,
  size,
  minY:bbox.min.y,
  maxDim:Math.max(size.x,size.y,size.z,0.001)
 };
 applyFoodScale();
});

// ---- 3D / AR Display via Zappar for A-Frame (Instant World Tracking)
async function showModel(){
 if(!it)return;
 if(customBlobUrl){URL.revokeObjectURL(customBlobUrl);customBlobUrl=null}
 let dbM=null;
 try{dbM=await dbGet(it.n)}catch(e){}
 const modelSrc=dbM?URL.createObjectURL(new Blob([dbM],{type:'model/gltf-binary'})):(it.glb||'/models/burger.glb');
 if(dbM)customBlobUrl=modelSrc;

 // Reset placement tracker state
 const tracker=$('#instant-tracker');
 isPlaced=false;
 currentScaleMultiplier=1.0;
 if(tracker){
  tracker.setAttribute('zappar-instant','placement-mode: true; anchorPoseOffset: 0 -0.28 -1.2;');
 }
 const placeBtn=$('#ar-place-btn');
 if(placeBtn)placeBtn.innerHTML='📍 วางบนโต๊ะตรงนี้ (ล็อคพื้น)';

 foodModelEl.setAttribute('gltf-model',modelSrc);
}

// Touch & Mouse gestures to smoothly rotate food dish in AR
let isInteracting=false,lastCoordX=0;
const stageEl=$('#stage');
stageEl.addEventListener('touchstart',e=>{
 if(e.target.closest('#ar-controls-overlay button,#vback,#badge'))return;
 if(e.touches.length===1){isInteracting=true;lastCoordX=e.touches[0].clientX}
},{passive:true});
stageEl.addEventListener('touchmove',e=>{
 if(!isInteracting||e.touches.length!==1)return;
 const dx=e.touches[0].clientX-lastCoordX;
 lastCoordX=e.touches[0].clientX;
 const container=$('#food-container');
 if(container){
  const rot=container.getAttribute('rotation')||{x:0,y:0,z:0};
  container.setAttribute('rotation',{x:rot.x,y:(rot.y+dx*0.75)%360,z:rot.z});
 }
},{passive:true});
stageEl.addEventListener('touchend',()=>{isInteracting=false});

stageEl.addEventListener('mousedown',e=>{
 if(e.target.closest('#ar-controls-overlay button,#vback,#badge'))return;
 isInteracting=true;lastCoordX=e.clientX;
});
window.addEventListener('mousemove',e=>{
 if(!isInteracting)return;
 const dx=e.clientX-lastCoordX;
 lastCoordX=e.clientX;
 const container=$('#food-container');
 if(container){
  const rot=container.getAttribute('rotation')||{x:0,y:0,z:0};
  container.setAttribute('rotation',{x:rot.x,y:(rot.y+dx*0.75)%360,z:rot.z});
 }
});
window.addEventListener('mouseup',()=>{isInteracting=false});

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amt){const f=(t,v)=>t+String(v.length).padStart(2,'0')+v;let tag='01',v=id;
 if(id.length===13){tag='02'}else{v='0066'+id.slice(1)}
 const p=f('00','01')+f('01','12')+f('29',f('00','A000000677010111')+f(tag,v))+f('53','764')+f('54',amt.toFixed(2))+f('58','TH')+'6304';return p+crc16(p)}
function payStep(t,order){const sb=$('#sb'),close=()=>$('#sheet').hidden=true,btn='border:0;padding:13px;width:100%;font-size:15px;margin-top:8px';
 const done=m=>{order.no='A'+Math.floor(1000+Math.random()*9000);cart=[];$('#cn').textContent=0;close();startTrack(order,m);return};

  sb.innerHTML='<h3 style="margin:0">ชำระเงิน '+fmt(t)+'</h3><small style="color:var(--mut)">เบอร์พร้อมเพย์ (10 หลัก) หรือเลขผู้เสียภาษี (13 หลัก) ของร้าน</small><input id="ppid" class="in" inputmode="numeric" placeholder="0812345678" value="'+saved+'"><button id="m1" class="mi"><span class="e">📱</span><span class="t"><b>พร้อมเพย์ (สแกน QR)</b><small>สแกนจากแอปธนาคารได้ทุกธนาคาร</small></span></button><button id="m2" class="mi" style="margin-top:8px"><span class="e">💳</span><span class="t"><b>บัตรเครดิต/เดบิต</b><small>เดโม — ไม่เก็บข้อมูลบัตรจริง</small></span></button><button id="m3" class="mi" style="margin-top:8px"><span class="e">💵</span><span class="t"><b>เงินสดปลายทาง</b><small>จ่ายเมื่อรับอาหาร</small></span></button><button id="mx" class="ib" style="'+btn+'">ปิด</button>';
  $('#mx').onclick=close;$('#m3').onclick=()=>done('เงินสดปลายทาง');
  $('#m2').onclick=()=>{sb.innerHTML='<p style="text-align:center;padding:30px">💳 กำลังประมวลผลบัตร…</p>';setTimeout(()=>done('บัตร (เดโม)'),1600)};
  $('#m1').onclick=()=>{const id=$('#ppid').value.replace(/\D/g,'');if(id.length!==10&&id.length!==13){toast('ใส่เบอร์ 10 หลัก หรือเลขผู้เสียภาษี 13 หลัก');return}
   try{localStorage.setItem('pp',id)}catch(e){}
   const pl=ppPayload(id,t);let im='';try{const q=qrcode(0,'M');q.addData(pl);q.make();im='<img src="'+q.createDataURL(6,2)+'" style="width:240px;height:240px;image-rendering:pixelated;background:#fff;border-radius:12px">';}catch(e){im='<p style="word-break:break-all;font-size:11px">'+pl+'</p>'}
   sb.innerHTML='<div style="text-align:center"><h3 style="margin:0">สแกนเพื่อจ่าย '+fmt(t)+'</h3><p style="color:var(--mut);margin:4px 0 10px;font-size:13px">พร้อมเพย์ •••'+id.slice(-4)+'</p>'+im+'<p style="color:var(--mut);font-size:12px">เปิดแอปธนาคาร → สแกน QR → ยืนยันยอดตามที่แสดง</p></div><button id="pd" class="tag" style="'+btn+'">ฉันโอนแล้ว ✓</button><button id="pb" class="ib" style="'+btn+'">← เลือกวิธีอื่น</button>';
   $('#pd').onclick=()=>done('พร้อมเพย์');$('#pb').onclick=menu}};

  <div class="bn" style="padding:12px;margin-bottom:10px"><b>📍 ${esc(addr.label)} • ${esc(addr.who)}</b><p>${esc(addr.text)}${addr.detail?' ('+esc(addr.detail)+')':''}</p><button id="ea" class="ib" style="margin-top:8px">แก้ไขที่อยู่</button></div>

  ${rows.map(a=>`<div class="row" style="justify-content:space-between;margin-bottom:4px"><span>${a[0]}</span><span>${money(a[1])}</span></div>`).join('')}

let tk=null,mAuto=true;

const RIDERS=[['สมชาย ใจดี','กท 1234','🧑'],['วิภา สุขสันต์','ขข 5678','👩'],['ธนากร มั่นคง','คง 2468','🧔']];
const vb={x:0,y:0,w:360};
function buildMap(){let sd=11;const Rnd=()=>(sd=sd*16807%2147483647)/2147483647;
 const V=[20,60,120,180,240,300,340],H=[25,55,110,150,175,215,238],MX=[60,180,300],MY=[55,110,175,215],xs=[0,...V,360],ys=[0,...H,250],P=['#dcd6c8','#d3cdbf','#e2ddd0','#cfc9ba','#e6e1d5'];
 let o='<rect width="360" height="250" fill="#ebe7dc"/>';
 for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){
  const x0=xs[i]+(i?8:0),x1=xs[i+1]-(i<xs.length-2?8:0),y0=ys[j]+(j?8:0),y1=ys[j+1]-(j<ys.length-2?8:0),w=x1-x0,h=y1-y0;if(w<8||h<8)continue;
  if(Rnd()<.13){o+=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="3" fill="#cfe5c3"/>`;for(let k=0;k<Math.floor(w*h/90);k++)o+=`<circle cx="${(x0+3+Rnd()*(w-6)).toFixed(1)}" cy="${(y0+3+Rnd()*(h-6)).toFixed(1)}" r="${(1.8+Rnd()*1.6).toFixed(1)}" fill="#8fc27a"/>`;continue}
  const nx=w>40?2+(Rnd()<.5?1:0):1,ny=h>35?2:1,bw=w/nx,bh=h/ny;
  for(let a=0;a<nx;a++)for(let b=0;b<ny;b++){const bx=x0+a*bw+1,by=y0+b*bh+1,ww=bw-2,hh=bh-2,c=P[Math.floor(Rnd()*P.length)];
   o+=`<rect x="${(bx+1.6).toFixed(1)}" y="${(by+1.6).toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" fill="#0002"/><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" fill="${c}" stroke="#bdb6a4" stroke-width=".4"/>`;
   if(ww>10&&hh>8)o+=`<rect x="${(bx+ww*.2).toFixed(1)}" y="${(by+hh*.2).toFixed(1)}" width="${(ww*.6).toFixed(1)}" height="${(hh*.6).toFixed(1)}" fill="#0000000d"/>`}}
 o+='<path d="M-10,138 C80,122 150,170 250,146 S340,152 380,140" fill="none" stroke="#bcd9ee" stroke-width="27"/><path d="M-10,138 C80,122 150,170 250,146 S340,152 380,140" fill="none" stroke="#a5cfec" stroke-width="23"/>';
 const ln=(x1,y1,x2,y2,c,w,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"${d?' stroke-dasharray="'+d+'"':''}/>`;
 const minor=V.filter(x=>!MX.includes(x)).map(x=>[x,0,x,250]).concat(H.filter(y=>!MY.includes(y)).map(y=>[0,y,360,y])),main=MX.map(x=>[x,0,x,250]).concat(MY.map(y=>[0,y,360,y]));
 minor.forEach(l=>o+=ln(...l,'#d9d3c4',9));minor.forEach(l=>o+=ln(...l,'#fff',7));
 main.forEach(l=>o+=ln(...l,'#e3c36a',15));main.forEach(l=>o+=ln(...l,'#ffeab0',13));main.forEach(l=>o+=ln(...l,'#fff',.6,'4 4'));
 [[64,95,'ถ.สุขุมวิท',-90],[184,100,'ถ.เพชรบุรี',-90],[304,200,'ถ.พระราม 9',-90],[200,108,'ถ.ราชดำริ',0],[100,173,'ถ.สีลม',0],[250,213,'ถ.สาทร',0]].forEach(t=>o+=`<text x="${t[0]}" y="${t[1]}" font-size="5.5" fill="#8a8470" transform="rotate(${t[3]} ${t[0]} ${t[1]})">${t[2]}</text>`);
 return o}

function camTo(pt,s){if(!mAuto)return;const z=s===0||s===4?1:s===3?2.3:1.7,w=360/z,h=w*250/360,tx=Math.min(360-w,Math.max(0,pt.x-w/2)),ty=Math.min(250-h,Math.max(0,pt.y-h/2)),k=z===1?.08:.07;

$('#map').innerHTML='<g id="mg">'+buildMap()+'<g id="dyn"></g></g>';
function dynMap(o){const d=destFor(o.rest,o.addr),r0=route(RIDERS[0]?[120,55]:[60,110],o.rest.pos),r1=route(o.rest.pos,d);
 const d0='M'+r0.map(p=>p.join(',')).join('L'),d1='M'+r1.map(p=>p.join(',')).join('L');

function trackLoop(now){if(!tk||$('#track').hidden)return;const t=(now-tk.t0)/1000,T=[4,14,18,38],s=t<T[0]?0:t<T[1]?1:t<T[2]?2:t<T[3]?3:4;
 const p0=$('#p0'),p1=$('#p1');let pa=p0,pr=0;
 if(t<T[0])pr=0;else if(t<T[1])pr=(t-T[0])/(T[1]-T[0]);else if(t<T[2])pr=1;else{pa=p1;pr=Math.min(1,(t-T[2])/(T[3]-T[2]))}
 const L=pa.getTotalLength(),pt=pa.getPointAtLength(pr*L),p2=pa.getPointAtLength(Math.min(L,pr*L+3));if(Math.hypot(p2.x-pt.x,p2.y-pt.y)>.1)tk.ang=Math.atan2(p2.y-pt.y,p2.x-pt.x)*180/Math.PI;$('#rid').setAttribute('transform','translate('+pt.x+','+pt.y+')');$('#rar').setAttribute('transform','rotate('+(tk.ang||0)+')');camTo(pt,s);
 const rem=Math.max(0,Math.ceil((T[3]-t)/T[3]*(tk.o.eta||eta(tk.o.rest))));$('#ts').textContent=TTL[s];$('#te').textContent=s<4?'ถึงประมาณ '+tk.arr+' น. • อีก ~'+rem+' นาที (เดโมเร่งเวลา)':'ส่งสำเร็จ '+clock(0)+' น.';$('#er').textContent=s<4?'อีก ~'+rem+' นาที':'ถึงแล้ว ✓';
 if(tk.s!==s){tk.s=s;$('#bi').style.width=(s/4*100)+'%';document.querySelectorAll('.stp span').forEach((e,i)=>e.classList.toggle('on',i<=s));
  const r=tk.rd;$('#rdc').innerHTML=s===0?'<div class="rd"><span style="font-size:30px">🔍</span><span>กำลังหาไรเดอร์ใกล้ร้าน…</span></div>':`<div class="rd"><span style="font-size:36px">${r[2]}</span><span style="flex:1"><b>${r[0]}</b><small style="display:block;color:var(--mut)">🛵 ${r[1]} • ⭐ 4.9</small></span><button class="ib" id="rc">📞</button><button class="ib" id="rm">💬</button></div>`;
  if($('#rc')){$('#rc').onclick=$('#rm').onclick=()=>toast('เดโม: โทร/แชทกับไรเดอร์จริงยังไม่รองรับ')}
  if(s===4){$('#fb').innerHTML='<div class="bn" style="text-align:center"><b>ให้คะแนนไรเดอร์</b><div id="st" style="font-size:30px;margin:8px 0">☆☆☆☆☆</div><button id="fx" class="tag" style="'+BT+'">เสร็จสิ้น</button></div>';
   $('#st').onclick=e=>{const w=$('#st').getBoundingClientRect();tk.stars=Math.max(1,Math.ceil((e.clientX-w.left)/w.width*5));$('#st').textContent='★'.repeat(tk.stars)+'☆'.repeat(5-tk.stars)};
   $('#fx').onclick=()=>{tk=null;$('#track').hidden=true;go('home');toast('ขอบคุณที่ใช้บริการ 💚')}}}
 requestAnimationFrame(trackLoop)}
$('#tb').onclick=()=>{tk=null;$('#track').hidden=true;go('home')};
$('#mzi').onclick=()=>{vb.w=Math.max(100,vb.w*0.8);mapRender()};
$('#mzo').onclick=()=>{vb.w=Math.min(450,vb.w*1.2);mapRender()};
$('#mre').onclick=()=>{mAuto=true;toast('ติดตามไรเดอร์อัตโนมัติ')};

setAt();
})();
</script>
